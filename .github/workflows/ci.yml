name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rung
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rung
        options: >-
          --health-cmd "pg_isready -U rung"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv pip install --system -r backend/pyproject.toml
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rung:testpass@localhost:5432/rung
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkey000000000000000000000000000000000000000000000000
          INTERNAL_API_TOKEN: testtoken
          ENV: dev
          DEV_AUTH: 'true'
        run: pytest tests -x -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pnpm install
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile dev build
