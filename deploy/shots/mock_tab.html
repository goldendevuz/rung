<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #fff; }
    .tab-bar { background: #000; padding-top: 8px; width: 600px; border-radius: 8px 8px 0 0; overflow: hidden; }
    .tab { background: #323639; border-radius: 8px 8px 0 0; display: inline-flex; align-items: center; padding: 0 16px; height: 34px; min-width: 200px; font-size: 12px; margin-left: 8px; position: relative; }
    .tab::before, .tab::after { content: ''; position: absolute; bottom: 0; width: 16px; height: 16px; pointer-events: none; }
    .tab::before { left: -16px; border-bottom-right-radius: 8px; box-shadow: 8px 0 0 0 #323639; }
    .tab::after { right: -16px; border-bottom-left-radius: 8px; box-shadow: -8px 0 0 0 #323639; }
    .favicon { width: 16px; height: 16px; margin-right: 12px; }
    .title { flex-grow: 1; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .address-bar { background: #323639; padding: 8px; display: flex; align-items: center; }
    .omnibox { background: #202124; border-radius: 16px; padding: 6px 16px; font-size: 14px; flex-grow: 1; margin-left: 12px; color: #e8eaed; }
  </style>
</head>
<body>
  <div style="border-radius: 8px; box-shadow: 0 12px 24px rgba(0,0,0,0.5);">
    <div class="tab-bar">
      <div class="tab">
        <img class="favicon" src="http://localhost:5173/favicon.svg" />
        <span class="title">Rung — Bir pog'ona yuqoriga</span>
      </div>
    </div>
    <div class="address-bar">
      <div style="display:flex;gap:12px;margin-left:8px;color:#9aa0a6;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 101-5l-4 4"/></svg>
      </div>
      <div class="omnibox">localhost:5173</div>
    </div>
    <div style="height: 100px; background: #0D0F11; border-radius: 0 0 8px 8px;"></div>
  </div>
</body>
</html>
