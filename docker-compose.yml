name: rung
x-common-env:
  TZ: ${TZ:-Asia/Tashkent}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rung}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    profiles:
    - dev
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-rung} -d ${POSTGRES_DB:-rung}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  postgres_prod:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rung}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    profiles:
    - prod
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-rung} -d ${POSTGRES_DB:-rung}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    command: postgres -c shared_buffers=64MB -c max_connections=20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - redis_data:/data
    ports:
    - 127.0.0.1:${REDIS_HOST_PORT:-6379}:6379
    profiles:
    - dev
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
  redis_prod:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - redis_data:/data
    profiles:
    - prod
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    memswap_limit: 64m
    command: redis-server --maxmemory 48mb --maxmemory-policy noeviction
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
    - alembic
    - upgrade
    - head
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
    - dev
    restart: 'no'
  migrate_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
    - alembic
    - upgrade
    - head
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres_prod:
        condition: service_healthy
    profiles:
    - prod
    restart: 'no'
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      ENV: ${ENV:-dev}
      DEV_AUTH: ${DEV_AUTH:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-rung_uz_bot}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:-}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      SHOW_PAYMENT_DETAILS: ${SHOW_PAYMENT_DETAILS:-false}
      STARS_ENABLED: ${STARS_ENABLED:-true}
      PAYNET_ENABLED: ${PAYNET_ENABLED:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      B_UNIT_UZS: ${B_UNIT_UZS:-1000}
      STARS_UNITS_PER_STAR: ${STARS_UNITS_PER_STAR:-200}
      FLOOR_B: ${FLOOR_B:-1}
      MIN_STEP_B: ${MIN_STEP_B:-1}
      ENABLED_LISTING_KINDS: ${ENABLED_LISTING_KINDS:-channel}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
    - ./backend:/app
    ports:
    - 127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000
    profiles:
    - dev
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  backend_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis_prod:6379/0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      ENV: ${ENV:-prod}
      DEV_AUTH: ${DEV_AUTH:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-rung_uz_bot}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:-}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      SHOW_PAYMENT_DETAILS: ${SHOW_PAYMENT_DETAILS:-false}
      STARS_ENABLED: ${STARS_ENABLED:-true}
      PAYNET_ENABLED: ${PAYNET_ENABLED:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      B_UNIT_UZS: ${B_UNIT_UZS:-1000}
      STARS_UNITS_PER_STAR: ${STARS_UNITS_PER_STAR:-200}
      FLOOR_B: ${FLOOR_B:-1}
      MIN_STEP_B: ${MIN_STEP_B:-1}
      ENABLED_LISTING_KINDS: ${ENABLED_LISTING_KINDS:-channel}
      WORKERS: '1'
      WEB_CONCURRENCY: '1'
    depends_on:
      migrate_prod:
        condition: service_completed_successfully
      redis_prod:
        condition: service_healthy
    profiles:
    - prod
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    memswap_limit: 256m
  worker:
    build: &id001
      context: ./backend
      dockerfile: Dockerfile
    command: &id002
    - python
    - -m
    - app.workers.main
    restart: unless-stopped
    environment: &id003
      TZ: ${TZ:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis_prod:6379/0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      ENV: ${ENV:-prod}
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:-}
      B_UNIT_UZS: ${B_UNIT_UZS:-1000}
      STARS_UNITS_PER_STAR: ${STARS_UNITS_PER_STAR:-200}
      FLOOR_B: ${FLOOR_B:-1}
      MIN_STEP_B: ${MIN_STEP_B:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles:
    - dev
    healthcheck: &id004
      test:
      - CMD
      - test
      - -f
      - /tmp/worker_heartbeat
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  bot:
    build: &id005
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &id006
      TZ: ${TZ:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-rung_uz_bot}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:-}
      BACKEND_URL: http://backend_prod:8000
      ENV: ${ENV:-prod}
    profiles:
    - dev
    healthcheck: &id007
      test:
      - CMD
      - test
      - -f
      - /tmp/bot_heartbeat
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    volumes:
    - ./frontend:/app
    - /app/node_modules
    ports:
    - 127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173
    profiles:
    - dev
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5173
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
  caddy_dev:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
    - 127.0.0.1:${HTTP_PORT:-80}:80
    - 127.0.0.1:${HTTPS_PORT:-443}:443
    volumes:
    - ./deploy/caddy/dev/Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    profiles:
    - dev
    healthcheck:
      test:
      - CMD
      - caddy
      - validate
      - --config
      - /etc/caddy/Caddyfile
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  caddy:
    restart: unless-stopped
    volumes:
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
      backend_prod:
        condition: service_healthy
    profiles:
    - prod
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:80/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    memswap_limit: 64m
    build:
      context: .
      dockerfile: deploy/caddy/prod/Dockerfile
      args:
        VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://rung.uz}
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
    - caddy
    profiles:
    - tunnel
    - prod
    mem_limit: 64m
    memswap_limit: 64m
  worker_prod:
    build: *id001
    command: *id002
    restart: unless-stopped
    environment: *id003
    depends_on:
      migrate_prod:
        condition: service_completed_successfully
      redis_prod:
        condition: service_healthy
    profiles:
    - prod
    healthcheck: *id004
    mem_limit: 192m
    memswap_limit: 192m
  bot_prod:
    build: *id005
    restart: unless-stopped
    environment: *id006
    profiles:
    - prod
    healthcheck: *id007
    mem_limit: 256m
    memswap_limit: 256m
volumes:
  postgres_data: null
  redis_data: null
  caddy_data: null
  caddy_config: null
